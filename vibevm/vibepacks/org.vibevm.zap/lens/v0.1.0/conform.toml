# conform.toml — this project's AI-Native discipline policy
# (ENGINE-CONFORM; generated by `typescript-ai-native init`, then owned by you).
#
# The [typescript] table drives the ts-tsc structural gate
# (`typescript-ai-native-conform`): the §8 unsafe-set ban, cell isolation over
# import specifiers, and the file-length budget. Cells start EXEMPT and
# flip into `gated` one by one, each after its findings drain to zero
# (expand-as-you-conform — a flip must never widen a baseline). Rust-side
# keys stay at their defaults until Rust code joins the tree.

max_file_lines = 600

[typescript]
roots = ["src"]
exclude_substrings = ["/fixtures/"]
gated = ["agent-runtime", "broker", "codex-coordinator", "coordinator-routing", "host-adapters", "http", "managed-terminal", "managed-terminal-service", "managed-terminal-store", "mcp", "model-policy", "model-policy-service", "model-policy-store", "plan-authoring", "protocol", "quicklens-demo", "quicklens-graph", "quicklens-model", "quicklens-service", "quicklens-ui", "session-vault", "specification-watch", "transport", "wayfinder-agent", "wayfinder-runtime", "web-auth", "web-gateway", "workspace-client", "workspace-demo", "workspace-interaction", "workspace-model", "workspace-planning", "workspace-service", "workspace-store", "workspace-ui", "zap-client"]
cells_dir = "src/cells"
seam = "index"
