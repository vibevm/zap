# specmap.toml — this project's traceability policy
# (PROP-014; generated by `rust-ai-native init`, then owned by you).

# The spec:// namespace this project's units are minted under.
namespace = "org.vibevm.zap/zap"

scan_roots = [
    "crates/zap-api",
    "crates/zap-app",
    "crates/zap-cli",
    "crates/zap-core",
    "crates/zap-domain",
    "crates/zap-legacy",
    "crates/zap-runtime",
    "crates/zap-store",
    "crates/zap-wire",
]
# Inventory the published specification and instruction surface. Development
# packets are excluded from the payload and must not leave dangling units in
# its derived index. Logical spec:// paths remain relative to vibevm/vibespecs.
spec_roots = [
    "vibevm/vibespecs/flows",
    "vibevm/vibespecs/boot",
    "vibevm/vibespecs/research",
    "vibevm/vibespecs/skills",
]
root_spec_docs = []
exempt = []
dispositioned = []

# Product source carries only `org.vibevm.zap/zap` edges. Package-local
# vendored specmark sources are byte-verified external inputs documented in
# `crates/vendor/PROVENANCE.md`; they are outside the project scan instead of
# importing their upstream namespaces into ZAP's index. This policy is stable
# both in the source package and in a Vibe-installed sibling dependency layout.
