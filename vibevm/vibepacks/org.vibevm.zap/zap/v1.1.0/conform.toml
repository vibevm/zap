# conform.toml — this project's AI-Native discipline policy
# (ENGINE-CONFORM; generated by `rust-ai-native init`, then owned by you).
#
# The gate enforces only what this file gates. Crates start EXEMPT and
# flip into `gated` one by one, each after its violations drain
# to zero (expand-as-you-conform — a flip must never widen a baseline).

max_file_lines = 600

[rust]
# Product crates are the conformance units. The two package-local specmark
# crates under `crates/vendor/` are byte-verified external source; their exact
# upstream identity and hashes live in `crates/vendor/PROVENANCE.md`.
roots = ["crates/*"]
exclude_substrings = []
gated = ["zap-api", "zap-app", "zap-cli", "zap-core", "zap-domain", "zap-legacy", "zap-runtime", "zap-store", "zap-wire"]
gated_pub_doctest = ["zap-api", "zap-app", "zap-cli", "zap-core", "zap-domain", "zap-legacy", "zap-runtime", "zap-store", "zap-wire"]
audit_crates = []
env_roots = ["crates/zap-cli/src/main.rs"]
