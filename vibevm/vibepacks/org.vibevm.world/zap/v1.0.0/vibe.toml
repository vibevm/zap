[package]
name = "zap"
group = "org.vibevm.world"
kind = "flow"
version = "1.0.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "Adaptive campaign runtime with explicit uncertainty, owner-defined stops, trusted control, replay, graph queries, and durable execution"
keywords = ["planning", "campaigns", "facts", "observability", "decisions", "recovery", "lowering", "runtime", "backend"]

[compatibility]
min_vibe_version = "0.1.0"
requires_kinds = []

# This is an independently selectable successor design, not a second central
# authority installed on top of multi-user-planning. No upstream skill or
# tracker service is a runtime dependency. Existing campaigns stay on MUP.
[boot_snippet]
source = "vibevm/vibespecs/boot/13-flow-zap.xml"
category = "flow"
concepts = ["adaptive planning", "explicit uncertainty", "decision provenance", "owner-defined stops"]

[[skill]]
name = "zap-draft"
path = "vibevm/vibespecs/skills/zap-draft"
description = "Draft or revise a ZAP campaign methodology, owner contract and obligation graph without activating execution"

[[skill]]
name = "zap-state"
path = "vibevm/vibespecs/skills/zap-state"
description = "Import, migrate, inspect, query, repair and operate an isolated ZAP campaign store through its public Python CLI"

[[skill]]
name = "zap-run"
path = "vibevm/vibespecs/skills/zap-run"
description = "Configure trusted ZAP control, run the persistent coordinator, and serve the authenticated graph backend"
